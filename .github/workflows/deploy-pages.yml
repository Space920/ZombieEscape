name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate live data
        env:
          LIVE_FALLBACK_URL: ${{ secrets.LIVE_FALLBACK_URL }}
          HISTORY_GRAPH_URL: ${{ secrets.HISTORY_GRAPH_URL }}
          MAP_PROGRESS_MAPEADORES_CSV: ${{ secrets.MAP_PROGRESS_MAPEADORES_CSV }}
          MAP_PROGRESS_GFL_CSV: ${{ secrets.MAP_PROGRESS_GFL_CSV }}
        run: npm run generate:data
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
