name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Off-hour fallback if the keep-alive chain dies. GitHub drops */15 crons.
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      chain:
        description: Internal follow-up refresh
        type: boolean
        default: false
      keep_alive:
        description: Queue another refresh after this deploy
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for next live snapshot
        if: github.event_name == 'workflow_dispatch' && inputs.chain
        run: sleep 600

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate live data
        env:
          LIVE_FALLBACK_URL: ${{ secrets.LIVE_FALLBACK_URL }}
          DIRECTORY_URL: ${{ secrets.DIRECTORY_URL }}
          HISTORY_GRAPH_URL: ${{ secrets.HISTORY_GRAPH_URL }}
          MAP_PROGRESS_MAPEADORES_CSV: ${{ secrets.MAP_PROGRESS_MAPEADORES_CSV }}
          MAP_PROGRESS_GFL_CSV: ${{ secrets.MAP_PROGRESS_GFL_CSV }}
        run: npm run generate:data
      - name: Confirm snapshot is fresh
        run: |
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('public/data/servers.json', 'utf8'));
            const ageMin = (Date.now() - Date.parse(data.updatedAt)) / 60000;
            if (!Number.isFinite(ageMin) || ageMin > 5) {
              console.error('servers.json is stale', data.updatedAt, 'ageMin=', ageMin);
              process.exit(1);
            }
            const gfl = data.servers.find((s) => s.id === 'gfl');
            console.log('snapshot', data.updatedAt, 'gfl', gfl && gfl.map, 'players', data.totals.players);
          "
      # Always rebuild. Caching `out` and copying JSON left GitHub Pages
      # serving an old export (Last-Modified stuck) even when generate:data ran.
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  queue-next:
    needs: deploy
    if: |
      success() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_dispatch' || inputs.keep_alive)
    runs-on: ubuntu-latest
    steps:
      - name: Queue follow-up refresh
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-pages.yml',
              ref: 'main',
              inputs: { chain: 'true', keep_alive: 'true' },
            });
